[project]
name = "glowing-octopus"
version = "0.1.0"
description = "Neural network study"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "einops>=0.8.2",
    "numpy>=2.5.4",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[project.scripts]
glowing-octopus = "glowing_octopus:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
anki = [
    "genanki>=0.13.1",
]
dev = [
    "ipykernel>=7.4.0",
]
